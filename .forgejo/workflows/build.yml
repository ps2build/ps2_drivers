name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Clean C:\ps2dev-consumer
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\ps2dev-consumer -ErrorAction SilentlyContinue

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: C:\ps2dev-consumer

      # ps2dev.cmake installed by setup-sdk itself; CMakeLists.txt
      # already defaults CMAKE_TOOLCHAIN_FILE to
      # $ENV{PS2DEV}/cmake/ps2dev.cmake, so setting PS2DEV is all this
      # needs.
      #
      # BUILD_SAMPLES=OFF: real, several samples need prerequisites this
      # CI doesn't fetch yet (world/audsrv, world/vorbis, world/ogg,
      # world/cdfs - the last one genuinely unmigrated anywhere). The
      # library itself (libps2_drivers.a) - what this validates - builds
      # clean regardless; the samples were verified manually against a
      # full local install this session (see FEEDBACK.md's own
      # "ps2_drivers ... fixed 2026-09-03" entry). Revisit once those
      # prerequisites are fetched here too, same pattern as sdk-world's
      # own "Fetch jpeg package" step.
      - name: Configure with CMake
        shell: pwsh
        run: |
          $env:PS2DEV = "C:\ps2dev-consumer"
          cmake -S . -B build -G Ninja `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\ps2_drivers `
            -DBUILD_SAMPLES=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Install
        shell: pwsh
        run: cmake --install build

      - name: Get short SHA
        id: slug
        shell: pwsh
        run: "'sha8=' + $env:GITHUB_SHA.Substring(0,8) >> $env:GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v3
        if: success()
        with:
          name: ps2_drivers-${{ steps.slug.outputs.sha8 }}
          path: C:\ps2dev-consumer\packages\world\ps2_drivers
